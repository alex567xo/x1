<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI视图创作 · 光影画廊</title>
<style>
:root{
  --bg:#07060d; --panel:rgba(255,255,255,.04); --line:rgba(255,255,255,.09);
  --txt:#eef0ff; --dim:#8b8fa8; --acc1:#7c5cff; --acc2:#ff5c9d; --acc3:#37e6c8;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
::selection{background:var(--acc2);color:#fff}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:#0a0912}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--acc1),var(--acc2));border-radius:6px}

/* ---------- 背景 ---------- */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.orb.o1{width:520px;height:520px;background:#5b3df0;top:-160px;left:-120px}
.orb.o2{width:460px;height:460px;background:#ff3d7f;bottom:-180px;right:-100px;animation-delay:-6s}
.orb.o3{width:380px;height:380px;background:#12c9a8;top:38%;left:60%;animation-delay:-12s;opacity:.22}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(70px,50px) scale(1.15)}}

/* ---------- 导航 ---------- */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;
  padding:18px 5vw;backdrop-filter:blur(14px);background:rgba(7,6,13,.55);border-bottom:1px solid var(--line)}
.logo{font-size:20px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,var(--acc1),var(--acc2),var(--acc3));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;gap:26px}
.nav-links a{color:var(--dim);text-decoration:none;font-size:14px;letter-spacing:1px;transition:.3s;position:relative}
.nav-links a:hover{color:#fff;text-shadow:0 0 14px var(--acc2)}
@media(max-width:640px){.nav-links{display:none}}

/* ---------- Hero ---------- */
header{position:relative;z-index:1;min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 6vw}
.badge{padding:8px 20px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--dim);letter-spacing:3px;
  background:var(--panel);backdrop-filter:blur(8px);animation:fadeUp 1s .2s both}
h1{font-size:clamp(44px,9vw,110px);font-weight:900;line-height:1.06;margin:26px 0 18px;animation:fadeUp 1s .4s both}
h1 .grad{background:linear-gradient(90deg,#9d7bff,#ff5c9d 45%,#37e6c8);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:hueflow 6s linear infinite}
@keyframes hueflow{to{background-position:200% 0}}
.sub{max-width:560px;color:var(--dim);font-size:16px;line-height:1.9;animation:fadeUp 1s .6s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.scroll-hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);color:var(--dim);font-size:12px;letter-spacing:3px;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}

/* ---------- 筛选 ---------- */
.tabs{position:relative;z-index:1;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px 0 46px}
.tab{padding:11px 30px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--dim);
  cursor:pointer;font-size:14px;letter-spacing:2px;transition:.35s;backdrop-filter:blur(8px)}
.tab:hover{color:#fff;border-color:rgba(255,92,157,.6);box-shadow:0 0 22px rgba(255,92,157,.25)}
.tab.active{color:#fff;border-color:transparent;background:linear-gradient(90deg,var(--acc1),var(--acc2));
  box-shadow:0 8px 30px rgba(255,92,157,.4);transform:translateY(-2px)}

/* ---------- 画廊 ---------- */
.gallery{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:0 5vw 120px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.card{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;background:#0d0b18;border:1px solid var(--line);
  opacity:0;transform:translateY(46px) scale(.96);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1),box-shadow .4s,border-color .4s;
  transform-style:preserve-3d;perspective:900px}
.card.show{opacity:1;transform:translateY(0) scale(1)}
.card.hide{opacity:0;transform:scale(.85);pointer-events:none;position:absolute;visibility:hidden}
.card:hover{box-shadow:0 24px 60px rgba(124,92,255,.35),0 0 0 1px rgba(255,255,255,.14);border-color:transparent}
.card .inner{transition:transform .25s ease;will-change:transform}
.card img,.card video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover img,.card:hover video{transform:scale(1.09)}
.card .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 48%,transparent 62%);
  transform:translateX(-120%);transition:transform .8s ease;pointer-events:none;z-index:2}
.card:hover .shine{transform:translateX(120%)}
.card .meta{position:absolute;left:0;right:0;bottom:0;padding:38px 18px 14px;z-index:3;
  background:linear-gradient(180deg,transparent,rgba(5,4,12,.85));display:flex;justify-content:space-between;align-items:flex-end;
  transform:translateY(8px);opacity:0;transition:.45s}
.card:hover .meta{transform:none;opacity:1}
.card .meta h3{font-size:16px;font-weight:700}
.card .meta span{font-size:11px;color:var(--dim);letter-spacing:2px}
.tag{position:absolute;top:14px;left:14px;z-index:3;padding:5px 14px;border-radius:999px;font-size:11px;letter-spacing:2px;
  background:rgba(7,6,13,.6);border:1px solid var(--line);backdrop-filter:blur(8px)}
.tag.video{border-color:rgba(55,230,200,.5);color:var(--acc3)}
.tag.photo{border-color:rgba(255,92,157,.5);color:var(--acc2)}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;width:66px;height:66px;border-radius:50%;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;transition:.35s}
.card:hover .play-btn{background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:0 0 34px rgba(255,92,157,.6);transform:translate(-50%,-50%) scale(1.12)}
.play-btn::before{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}

/* ---------- 灯箱 ---------- */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(4,3,10,.9);backdrop-filter:blur(18px);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.4s}
.lightbox.open{opacity:1;pointer-events:auto}
.lb-content{max-width:86vw;max-height:82vh;position:relative;transform:scale(.9);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.lightbox.open .lb-content{transform:scale(1)}
.lb-content img,.lb-content video{max-width:86vw;max-height:78vh;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.15)}
.lb-caption{margin-top:16px;text-align:center;color:var(--dim);font-size:14px;letter-spacing:2px}
.lb-close{position:absolute;top:26px;right:34px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:#fff;font-size:18px;cursor:pointer;transition:.3s;z-index:101}
.lb-close:hover{background:var(--acc2);transform:rotate(90deg)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:#fff;font-size:20px;cursor:pointer;transition:.3s;z-index:101}
.lb-nav:hover{background:var(--acc1)}
.lb-prev{left:26px}.lb-next{right:26px}
@media(max-width:640px){.lb-nav{display:none}}

footer{position:relative;z-index:1;text-align:center;padding:40px 0 54px;color:var(--dim);font-size:13px;letter-spacing:2px;border-top:1px solid var(--line)}
footer b{background:linear-gradient(90deg,var(--acc1),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
<style>
        /* 播放器容器样式 */
        #musicPlayer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 500px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        /* 播放器悬停效果 */
        #musicPlayer:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 1);
        }

        /* 按钮样式 */
        #musicPlayer button {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #musicPlayer button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, #5a7df4, #9867d5);
        }

        /* 当前播放信息样式 */
        #nowPlaying {
            flex-grow: 1;
            text-align: center;
            color: #555;
            font-size: 14px;
            padding: 0 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 隐藏原生audio元素 */
        #bgMusic {
            display: none;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            #musicPlayer {
                width: 90%;
                padding: 12px 15px;
                border-radius: 30px;
            }
            
            #musicPlayer button {
                padding: 6px 12px;
                font-size: 12px;
            }
            
            #nowPlaying {
                font-size: 12px;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<nav>
  <div class="logo">AI视图创作</div>
  <div class="nav-links">
    <a href="#works">作品集</a><a href="#works">图片</a><a href="#works">视频</a>
  </div>
</nav>

<header>
  <div class="badge">✦ 视觉艺术收藏馆 ✦</div>
  <h1>光影之间<br><span class="grad">遇见非凡</span></h1>
  <p class="sub">汇集流光溢彩的影像与动态视觉 —— 悬停感受 3D 视差，点击沉浸全屏欣赏。</p>
  <div class="scroll-hint">向下探索 ▾</div>
</header>

<section id="works">
  <div class="tabs">
    <button class="tab active" data-f="all">全部</button>
    <button class="tab" data-f="photo">图片</button>
    <button class="tab" data-f="video">视频</button>
  </div>
  <div class="gallery" id="gallery"></div>
</section>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-content" id="lbContent"></div>
</div>

<footer>LUMINA GALLERY — 用 <b>灵感</b> 与 <b>光影</b> 编织的视觉盛宴</footer>

<script>
/* ====== 数据 ====== */
const items = [
  {type:'video',src:'/AI mv/01.mp4', title:'律动极光', sub:'Motion · 01', },
  {type:'video',src:'/AI mv/02.mp4', title:'律动极光', sub:'Motion · 02', },
  {type:'video',src:'/AI mv/03.mp4', title:'律动极光', sub:'Motion · 03', },
  {type:'video',src:'/AI mv/04.mp4', title:'律动极光', sub:'Motion · 04', },
  {type:'video',src:'/AI mv/05.mp4', title:'律动极光', sub:'Motion · 05', },
  {type:'video',src:'/AI mv/06.mp4', title:'律动极光', sub:'Motion · 06', },
  {type:'video',src:'/AI mv/07.mp4', title:'律动极光', sub:'Motion · 07', },
  {type:'video',src:'/AI mv/08.mp4', title:'律动极光', sub:'Motion · 08', },
  {type:'video',src:'/AI mv/09.mp4', title:'律动极光', sub:'Motion · 09', },
  {type:'video',src:'/AI mv/10.mp4', title:'律动极光', sub:'Motion · 10', },
  {type:'video',src:'/AI mv/11.mp4', title:'律动极光', sub:'Motion · 11', },
  {type:'video',src:'/AI mv/12.mp4', title:'律动极光', sub:'Motion · 12', },
  {type:'video',src:'/AI mv/13.mp4', title:'律动极光', sub:'Motion · 13', },
  {type:'video',src:'/AI mv/14.mp4', title:'律动极光', sub:'Motion · 14', },
  {type:'video',src:'/AI mv/15.mp4', title:'律动极光', sub:'Motion · 15', },
  
];

/* ====== 构建画廊 ====== */
const gallery = document.getElementById('gallery');
items.forEach((it,i)=>{
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.type = it.type; card.dataset.idx = i;
  const media = it.type==='video'
    ? `<video src="${it.src}" poster="${it.poster}" muted loop playsinline preload="metadata"></video>
       <div class="play-btn"></div><span class="tag video">视频</span>`
    : `<img src="${it.src}" alt="${it.title}" loading="lazy"><span class="tag photo">图片</span>`;
  card.innerHTML = `<div class="inner">${media}</div><div class="shine"></div>
    <div class="meta"><h3>${it.title}</h3><span>${it.sub}</span></div>`;
  gallery.appendChild(card);
});

/* ====== 入场动画 ====== */
const io = new IntersectionObserver(es=>{
  es.forEach((e)=>{ if(e.isIntersecting){
    setTimeout(()=>e.target.classList.add('show'), (e.target.dataset.idx%3)*120);
    io.unobserve(e.target);
  }});
},{threshold:.12});
document.querySelectorAll('.card').forEach(c=>io.observe(c));

/* ====== 3D 视差 + 视频悬停播放 ====== */
document.querySelectorAll('.card').forEach(card=>{
  const inner = card.querySelector('.inner');
  card.addEventListener('mousemove',e=>{
    const r = card.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    inner.style.transform = `rotateY(${x*10}deg) rotateX(${-y*10}deg) scale(1.03)`;
  });
  card.addEventListener('mouseenter',()=>{
    const v=card.querySelector('video'); if(v){v.play().catch(()=>{});}
  });
  card.addEventListener('mouseleave',()=>{
    inner.style.transform='';
    const v=card.querySelector('video'); if(v){v.pause();}
  });
  card.addEventListener('click',()=>openLB(+card.dataset.idx));
});

/* ====== 筛选 ====== */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const f=t.dataset.f;
    document.querySelectorAll('.card').forEach(c=>{
      const show = f==='all'||c.dataset.type===f;
      if(show){ c.classList.remove('hide'); requestAnimationFrame(()=>c.classList.add('show')); }
      else{ c.classList.add('hide'); c.classList.remove('show'); }
    });
  });
});

/* ====== 灯箱 ====== */
const lb=document.getElementById('lightbox'), lbC=document.getElementById('lbContent');
let cur=0;
const visibleList=()=>[...document.querySelectorAll('.card:not(.hide)')].map(c=>+c.dataset.idx);
function renderLB(){
  const it=items[cur];
  lbC.innerHTML = it.type==='video'
    ? `<video src="${it.src}" controls autoplay loop playsinline></video><div class="lb-caption">${it.title} · ${it.sub}</div>`
    : `<img src="${it.src}" alt="${it.title}"><div class="lb-caption">${it.title} · ${it.sub}</div>`;
}
function openLB(i){ cur=i; renderLB(); lb.classList.add('open'); document.body.style.overflow='hidden'; }
function closeLB(){ lb.classList.remove('open'); lbC.innerHTML=''; document.body.style.overflow=''; }
function step(d){ const l=visibleList(); const p=(l.indexOf(cur)+d+l.length)%l.length; cur=l[p]; renderLB(); }
document.getElementById('lbClose').onclick=closeLB;
document.getElementById('lbPrev').onclick=()=>step(-1);
document.getElementById('lbNext').onclick=()=>step(1);
lb.addEventListener('click',e=>{ if(e.target===lb) closeLB(); });
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLB(); if(e.key==='ArrowLeft')step(-1); if(e.key==='ArrowRight')step(1);
});

/* ====== 粒子星空 ====== */
const cv=document.getElementById('stars'),ctx=cv.getContext('2d');
let stars=[];
function resize(){ cv.width=innerWidth; cv.height=innerHeight;
  stars=Array.from({length:Math.min(140,innerWidth/9)},()=>({
    x:Math.random()*cv.width,y:Math.random()*cv.height,
    r:Math.random()*1.6+.3,s:Math.random()*.35+.08,
    hue:[265,330,175][Math.floor(Math.random()*3)],tw:Math.random()*Math.PI*2
  }));
}
resize(); addEventListener('resize',resize);
(function loop(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(const st of stars){
    st.y-=st.s; st.tw+=.04;
    if(st.y<-4){st.y=cv.height+4;st.x=Math.random()*cv.width;}
    ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,7);
    ctx.fillStyle=`hsla(${st.hue},90%,75%,${.35+.3*Math.sin(st.tw)})`;
    ctx.shadowBlur=8;ctx.shadowColor=`hsl(${st.hue},90%,70%)`;
    ctx.fill();ctx.shadowBlur=0;
  }
  requestAnimationFrame(loop);
})();
 </script>
 <!-- 音乐播放器 -->
    <div id="musicPlayer">
        <audio id="bgMusic"></audio>
        <button onclick="togglePlay()">播放/暂停</button>
        <span id="nowPlaying">当前播放: 准备播放...</span>
        <button onclick="nextTrack()">下一首</button>
    </div>

    <script>
        const playlist = [
            {title: "不谓侠", src: "/AI SHOW/buweixia.mp3"},
            {title: "致你", src: "/AI SHOW/zhini.mp3"},
            {title: "跳楼机", src: "/AI SHOW/tiaolouji.mp3"},
            {title: "你啊你啊", src: "/AI SHOW/niania.mp3"}
        ];
        
        let currentTrack = 0;
        const audioPlayer = document.getElementById('bgMusic');
        const nowPlaying = document.getElementById('nowPlaying');
        
        function playTrack(index) {
            currentTrack = index;
            audioPlayer.src = playlist[currentTrack].src;
            audioPlayer.play()
                .then(() => {
                    nowPlaying.textContent = "当前播放: " + playlist[currentTrack].title;
                })
                .catch(error => {
                    nowPlaying.textContent = "点击播放按钮开始播放";
                    console.log("自动播放被阻止:", error);
                });
        }
        
        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play()
                    .then(() => {
                        nowPlaying.textContent = "当前播放: " + playlist[currentTrack].title;
                    });
            } else {
                audioPlayer.pause();
            }
        }
        
        function nextTrack() {
            playTrack((currentTrack + 1) % playlist.length);
        }
        
        audioPlayer.addEventListener('ended', nextTrack);
        
        // 初始化但不自动播放（因为浏览器可能阻止自动播放）
        audioPlayer.src = playlist[currentTrack].src;
        nowPlaying.textContent = "点击播放按钮开始播放";
</script>
